# A kod $C700-tol (max. 1024 bajt; a bankbol kerul oda), a valtozok $CB00-tol ($CBC0-nal a 2. sprite). A $C080 + 3*(MAXLINES+2) = $C69E utan, a 2. sprite ($CBC0) elott.
MEMORY {
    SDC: start = $C700, size = $0400, file = %O;
    SDA: start = $CB9B, size = $0011, file = "";
    SDB: start = $C69E, size = $0062, file = "";   # sbuf (14) + ent (84): a sorok tablazata utan, az SD-kod elott
}
SEGMENTS { BLOB: load = SDC, type = ro; BSSA: load = SDA, type = bss; BSSB: load = SDB, type = bss; }
