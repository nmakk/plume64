# A kod $C700-tol (max. 1024 bajt, a valtozok $CB00-tol; a bankbol kerul oda), utana a valtozok. A $C080 + 3*(MAXLINES+2) = $C69E utan, a 2. sprite ($CBC0) elott.
MEMORY {
    SDC: start = $C700, size = $0400, file = %O;
    SDA: start = $CB6F, size = $0011, file = "";
    SDB: start = $CB80, size = $0040, file = "";
}
SEGMENTS { BLOB: load = SDC, type = ro; BSSA: load = SDA, type = bss; BSSB: load = SDB, type = bss; }
