# Edition REU : c64.cfg + zone d'overlays (voir src/reu.s, ovl_load). Les overlays sont
# ecrits dans <sortie>.1, .2... et rangés dans des banques de la cartouche (tools/mkcrt.py).
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:     type = import;
    __EXEHDR__:       type = import;
    __STACKSIZE__:    type = weak,   value = $0064;
    __HIMEM__:        type = weak,   value = $C000;
    __OVERLAYSIZE__:  type = weak,   value = $0F00;
    __OVERLAYSTART__: type = export, value = __HIMEM__ - __STACKSIZE__ - __OVERLAYSIZE__;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __OVERLAYSTART__ - __ONCE_RUN__;
    OVL1:     file = "%O.1",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL2:     file = "%O.2",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL3:     file = "%O.3",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL4:     file = "%O.4",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL5:     file = "%O.5",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL6:     file = "%O.6",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL7:     file = "%O.7",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL8:     file = "%O.8",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL9:     file = "%O.9",           start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL10:    file = "%O.10",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL11:    file = "%O.11",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL12:    file = "%O.12",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL13:    file = "%O.13",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL14:    file = "%O.14",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL15:    file = "%O.15",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL16:    file = "%O.16",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL17:    file = "%O.17",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL18:    file = "%O.18",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
    OVL19:    file = "%O.19",          start = __OVERLAYSTART__, size = __OVERLAYSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    OVERLAY1: load = OVL1,     type = ro,  define = yes, optional = yes;
    OVERLAY2: load = OVL2,     type = ro,  define = yes, optional = yes;
    OVERLAY3: load = OVL3,     type = ro,  define = yes, optional = yes;
    OVERLAY4: load = OVL4,     type = ro,  define = yes, optional = yes;
    OVERLAY5: load = OVL5,     type = ro,  define = yes, optional = yes;
    OVERLAY6: load = OVL6,     type = ro,  define = yes, optional = yes;
    OVERLAY7: load = OVL7,     type = ro,  define = yes, optional = yes;
    OVERLAY8: load = OVL8,     type = ro,  define = yes, optional = yes;
    OVERLAY9: load = OVL9,     type = ro,  define = yes, optional = yes;
    OVERLAY10: load = OVL10,   type = ro,  define = yes, optional = yes;
    OVERLAY11: load = OVL11,   type = ro,  define = yes, optional = yes;
    OVERLAY12: load = OVL12,   type = ro,  define = yes, optional = yes;
    OVERLAY13: load = OVL13,   type = ro,  define = yes, optional = yes;
    OVERLAY14: load = OVL14,   type = ro,  define = yes, optional = yes;
    OVERLAY15: load = OVL15,   type = ro,  define = yes, optional = yes;
    OVERLAY16: load = OVL16,   type = ro,  define = yes, optional = yes;
    OVERLAY17: load = OVL17,   type = ro,  define = yes, optional = yes;
    OVERLAY18: load = OVL18,   type = ro,  define = yes, optional = yes;
    OVERLAY19: load = OVL19,   type = ro,  define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
